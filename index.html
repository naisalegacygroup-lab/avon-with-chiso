<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Avon with Chiso - independent Avon distributor catalogue in Malawi. Browse available products and order conveniently through WhatsApp."
  >

  <meta name="theme-color" content="#171217">

  <title>Avon with Chiso</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      transition: opacity 0.3s ease;
    }

    .loading-box {
      text-align: center;
      padding: 30px;
    }

    .brand {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      font-weight: 600;
      color: #211820;
      margin-bottom: 8px;
    }

    .tagline {
      display: block;
      font-size: 13px;
      color: #786f76;
      letter-spacing: 0.4px;
      margin-bottom: 20px;
    }

    .loader {
      width: 34px;
      height: 34px;
      margin: 0 auto;
      border: 3px solid #eee7ec;
      border-top-color: #211820;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #shopFrame {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      border: 0;
      background: #ffffff;
    }

    .load-error {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 30px;
    }

    .load-error div {
      max-width: 420px;
    }

    .load-error h2 {
      margin: 0 0 10px;
      color: #211820;
    }

    .load-error p {
      color: #756d74;
      line-height: 1.5;
    }

    .load-error button {
      border: 0;
      background: #211820;
      color: #ffffff;
      padding: 13px 22px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div id="loadingScreen">
    <div class="loading-box">

      <span class="brand">
        Avon with Chiso
      </span>

      <span class="tagline">
        Beauty favourites, ready to order
      </span>

      <div class="loader"></div>

    </div>
  </div>


  <div id="loadError" class="load-error">
    <div>

      <h2>We couldn't open the shop</h2>

      <p>
        Please check your internet connection and try again.
      </p>

      <button onclick="location.reload()">
        Try again
      </button>

    </div>
  </div>


  <iframe
    id="shopFrame"
    src="https://script.google.com/macros/s/AKfycby6wl9fC16MHkDkV_uC8ZJBkI1uwlKjUKABInhNlfV-GDI-KqS83VmDU8Ea5ZED-T9d/exec"
    title="Avon with Chiso"
    allow="clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>


  <script>
    const frame = document.getElementById('shopFrame');
    const loading = document.getElementById('loadingScreen');
    const errorScreen = document.getElementById('loadError');

    let loaded = false;

    frame.addEventListener('load', function () {
      loaded = true;

      loading.style.opacity = '0';

      setTimeout(function () {
        loading.style.display = 'none';
      }, 300);
    });

    setTimeout(function () {
      if (!loaded) {
        loading.style.display = 'none';
        errorScreen.style.display = 'flex';
      }
    }, 15000);
  </script>

</body>
</html>
